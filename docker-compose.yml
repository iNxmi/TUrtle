volumes:
  storage:

services:
  database:
    image: postgres:18
    container_name: csw__turtle_database
    restart: no
    volumes:
      - storage:/var/lib/postgresql
    environment:
      TZ: "Europe/Berlin"
      POSTGRES_DB: db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin

  mailhog:
    image: mailhog/mailhog
    container_name: csw__turtle_mailhog
    restart: no
    ports:
      - "8025:8025"
    entrypoint: ["/bin/sh", "-c", "MailHog &>/dev/null"]
    environment:
      TZ: "Europe/Berlin"

  backend:
    build: backend
    container_name: csw__turtle_backend
    restart: no
    depends_on:
      - database
      - mailhog
    ports:
      - "8080:8080"
    environment:
      TZ: "Europe/Berlin"
      DATASOURCE_SERVER: database:5432
      DATASOURCE_DATABASE: db
      DATASOURCE_USERNAME: admin
      DATASOURCE_PASSWORD: admin
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_SECURE: false

  frontend:
    build: frontend
    container_name: csw__turtle_frontend
    restart: no
    depends_on:
      - backend
    environment:
      TZ: "Europe/Berlin"
      NODE_ENV: production
      ORIGIN: http://localhost
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  nginx:
    image: nginx:latest
    container_name: csw__turtle_proxy
    restart: no
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    environment:
      TZ: "Europe/Berlin"

  adminer:
    image: adminer:latest
    container_name: csw__turtle_adminer
    restart: no
    depends_on:
      - database
    ports:
      - "8000:8080"
    environment:
      TZ: "Europe/Berlin"
      ADMINER_DEFAULT_DB_DRIVER: pgsql
      ADMINER_DEFAULT_SERVER: database:5432
      ADMINER_DEFAULT_DATABASE: db
      ADMINER_DEFAULT_USERNAME: admin
      ADMINER_DEFAULT_PASSWORD: admin
      ADMINER_PLUGINS: "tables-filter tinymce dark-switcher"