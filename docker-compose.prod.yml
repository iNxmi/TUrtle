networks:
  network:

services:
  postgres:
    image: postgres:18
    container_name: csw__turtle_database
    restart: unless-stopped
    volumes:
      - ./data/database:/var/lib/postgresql
    networks:
      - network
    environment:
      POSTGRES_DB:
      POSTGRES_USER:
      POSTGRES_PASSWORD:

  backend:
    build: backend
    container_name: csw__turtle_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - mailhog
    networks:
      - network
    environment:
      DATASOURCE_SERVER: postgres:5432
      DATASOURCE_DATABASE:
      DATASOURCE_USERNAME:
      DATASOURCE_PASSWORD:
      SMTP_HOST:
      SMTP_PORT:
      SMTP_USERNAME:
      SMTP_PASSWORD:
      SMTP_SECURE: true

  frontend:
    build: frontend
    container_name: csw__turtle_frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - network
    environment:
      NODE_ENV: production
      ORIGIN: http://localhost
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host

  nginx:
    image: nginx:latest
    container_name: csw__turtle_proxy
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - network